<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — BELIGHT</title>
  <meta name="description" content="BELIGHT 프로젝트 문의">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a href="/" class="logo">BELIGHT</a>
      <nav class="nav" aria-label="주 메뉴">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/works">Works</a>
        <a href="/contact" aria-current="page">Contact</a>
      </nav>
      <button class="menu-btn" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <p class="eyebrow reveal">Contact</p>
        <h1 class="display reveal">프로젝트 문의</h1>
        <p class="lead reveal">아래 양식을 남겨주시면 영업일 기준 2일 이내에 답변드립니다.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="wrap contact-grid">
        <aside class="info reveal">
          <dl>
            <dt>Email</dt><dd><a href="mailto:hello@example.com">hello@example.com</a></dd>
            <dt>Phone</dt><dd>010-0000-0000</dd>
            <dt>Studio</dt><dd>서울특별시 OO구 OO로 00</dd>
            <dt>Hours</dt><dd>평일 10:00 – 18:00</dd>
          </dl>
        </aside>

        <!-- Formspree 폼 ID로 YOUR_FORM_ID 를 바꾸면 메일로 문의가 도착합니다 (README 참고) -->
        <form id="contact-form" class="form reveal" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <div class="field full">
            <label>문의 분야</label>
            <div class="chips">
              <input type="checkbox" id="t1" name="분야" value="Branding"><label for="t1">Branding</label>
              <input type="checkbox" id="t2" name="분야" value="Space"><label for="t2">Space</label>
              <input type="checkbox" id="t3" name="분야" value="Content"><label for="t3">Content</label>
              <input type="checkbox" id="t4" name="분야" value="기타"><label for="t4">기타</label>
            </div>
          </div>
          <div class="field"><label for="name">이름 *</label><input id="name" name="이름" required autocomplete="name"></div>
          <div class="field"><label for="company">회사 / 브랜드명</label><input id="company" name="회사" autocomplete="organization"></div>
          <div class="field"><label for="email">이메일 *</label><input id="email" type="email" name="email" required autocomplete="email"></div>
          <div class="field"><label for="phone">연락처</label><input id="phone" type="tel" name="연락처" autocomplete="tel"></div>
          <div class="field full">
            <label for="budget">예산</label>
            <select id="budget" name="예산">
              <option value="">선택해 주세요</option>
              <option>500만원 미만</option>
              <option>500만 – 1,000만원</option>
              <option>1,000만 – 3,000만원</option>
              <option>3,000만원 이상</option>
              <option>미정</option>
            </select>
          </div>
          <div class="field full"><label for="msg">프로젝트 내용 *</label><textarea id="msg" name="내용" required placeholder="프로젝트 배경, 일정, 참고 자료 등을 자유롭게 적어주세요."></textarea></div>
          <label class="agree full"><input type="checkbox" required> 개인정보 수집 및 이용에 동의합니다.</label>
          <div class="full"><button type="submit" class="btn btn-solid">문의 보내기 <span class="arrow">→</span></button></div>
          <p class="form-status full" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <p class="footer-big">BELIGHT</p>
        <div class="footer-links">
          <div><span>Menu</span><a href="/about">About</a><a href="/works">Works</a><a href="/contact">Contact</a></div>
          <div><span>Follow</span><a href="#">Instagram</a><a href="#">Behance</a></div>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span data-year></span> BELIGHT. All rights reserved.</span>
        <span>hello@example.com</span>
      </div>
    </div>
  </footer>
  <script src="/assets/main.js"></script>
</body>
</html>
